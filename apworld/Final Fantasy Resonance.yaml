# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Player{number}

# Used to describe your yaml. Useful if you have multiple files.
description: Default Final Fantasy Resonance Template

game: Final Fantasy Resonance
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Final Fantasy Resonance: 0.31.0 # Version of the world required for this yaml to work as expected.

Final Fantasy Resonance:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  ########
  # Goal #
  ########
  goal:
    # What completes your seed.
    # final_boss: win the last battle at the top of the Crystal Tower. The way up stays sealed until
    # you have the party members, visions and Crystal Fragments that final_boss_characters,
    # final_boss_visions and final_boss_fragments ask for.
    # tablet_shards: receive the number of Tablet Shards set by tablet_shards_required. Only shards
    # received from Archipelago count.
    tablet_shards: 0
    final_boss: 50

  tablet_shards_required:
    # With the tablet_shards goal: how many of the 99 Tablet Shards you must receive.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 99
    50: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-99: 0 # random value between 1 and 99

  final_boss_characters:
    # With the final_boss goal: how many party members you need before the way to the top of the
    # Crystal Tower opens. Your starting party counts.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 8
    6: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-8: 0 # random value between 0 and 8

  final_boss_visions:
    # With the final_boss goal: how many visions you need before the way to the top of the Crystal Tower opens.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 26
    12: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-26: 0 # random value between 0 and 26

  final_boss_fragments:
    # With the final_boss goal: how many Crystal Fragments you need before the way to the top of the
    # Crystal Tower opens. Every boss gives one when you beat it, story bosses, cave masters and the
    # optional bosses alike.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 40
    14: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-40: 0 # random value between 0 and 40

  #########
  # Start #
  #########
  starting_continent:
    # The continent you can land on at the start. Each other continent opens when you receive its
    # Unlock item.
    grandshelt: 50
    lanzelt: 0
    kolobos: 0
    dirnado: 0
    olderion: 0
    zoldaad: 0
    mysidia: 0
    gronoa: 0
    pharm: 0

  starting_roster:
    # How many party members you start with, all at level 1. With shuffle_party_members on, the
    # others are items you can find.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 4
    2: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-4: 0 # random value between 1 and 4

  starting_character_1:
    # The first party member, who leads the party.
    rain: 50
    lasswell: 0
    fina: 0
    lid: 0
    nichol: 0
    archwitch_fina: 0
    jake: 0
    sakura: 0

  starting_character_2:
    # The second party member, if starting_roster is 2 or more. A repeat is swapped for someone else.
    rain: 0
    lasswell: 50
    fina: 0
    lid: 0
    nichol: 0
    archwitch_fina: 0
    jake: 0
    sakura: 0

  starting_character_3:
    # The third party member, if starting_roster is 3 or more. A repeat is swapped for someone else.
    rain: 0
    lasswell: 0
    fina: 50
    lid: 0
    nichol: 0
    archwitch_fina: 0
    jake: 0
    sakura: 0

  starting_character_4:
    # The fourth party member, if starting_roster is 4. A repeat is swapped for someone else.
    rain: 0
    lasswell: 0
    fina: 0
    lid: 50
    nichol: 0
    archwitch_fina: 0
    jake: 0
    sakura: 0

  start_with_chocobo:
    # Your open world save has the Chocobo from the start. With this off, the Chocobo is an item
    # you find.
    'false': 0
    'true': 50

  start_with_airship:
    # You start in the airship. With this off, you start on foot on your starting continent, and the
    # Airship is an item you find. Until then the ferry and two bridges are the only ways between
    # continents, and Mysidia, Gronoa, Pharm and the Crystal Tower need the Airship.
    'false': 0
    'true': 50

  #############
  # Locations #
  #############
  include_radar_treasures:
    # The airship radar's 13 treasures, dug up at sea, are locations. Three Progressive Radars are
    # items in their place: the first finds treasures 1 to 5, the second 6 to 9, the third 10 to 13.
    # Each radar opens all of its treasures at once. They need the Airship.
    'false': 0
    'true': 50

  include_side_quests:
    # The rewards of 28 quests from the game's quest log are locations: the character quests, the
    # vision quests, the town quests and Mog Tag. A quest with a second reward (gil, an item or a
    # vision) has a second location for it. A quest's own fetch items (Ruby Fragments, Viscus
    # Vitae and the like) stay where they are, since the game tests the quest's progress, not them.
    'false': 50
    'true': 0

  priority_bosses:
    # The cave masters and the optional bosses (the two Dragon's Maw bosses and the Antlion) are
    # priority locations: the generator puts items that someone needs on them first, so they are
    # worth the fight. Sephiroth is left out, as he can be far too strong for the party.
    'false': 0
    'true': 50

  priority_story_bosses:
    # The story bosses are priority locations: the generator puts items that someone needs on them
    # first.
    'false': 50
    'true': 0

  excluded_regions:
    # Regions where you only find your own filler items, never anything another player needs. Use
    # this for areas you do not want to play.
    []

  #########
  # Items #
  #########
  shuffle_party_members:
    # The party members you do not start with are items. One you receive joins at your party's
    # average level. With this off, only your starting party plays.
    'false': 0
    'true': 50

  shuffle_visions:
    # The 26 visions are items. With this off, you start with Tronn and Leah, and the rest stay at
    # their Sanctums and locations in the world.
    'false': 0
    'true': 50

  shuffle_key_items:
    # The key items are items: keys, key cards, quest items and Colosseum proofs. Some doors and
    # chests need them.
    'false': 0
    'true': 50

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
